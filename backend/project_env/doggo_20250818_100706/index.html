<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dog Walk - a tiny dog walking game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="gameCanvas"></canvas>

    <div id="overlay" class="overlay" aria-hidden="true">
      <div class="panel">
        <h1>Dog Walk</h1>
        <p>Control your dog using the arrow keys or WASD. Collect sticks to score points as you walk.</p>
        <p>Press Enter to Start</p>
      </div>
    </div>

    <div class="hud" id="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Distance: <strong id="distance">0</strong> m</span>
      <span>Sticks: <strong id="sticksCount">0</strong></span>
    </div>
  </div>

  <script>
    (function(){
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let w=0,h=0;
      function resize(){
        w = canvas.width = Math.max(window.innerWidth, 320);
        h = canvas.height = Math.max(window.innerHeight, 240);
      }
      window.addEventListener('resize', resize);
      resize();

      const overlay = document.getElementById('overlay');
      const scoreEl = document.getElementById('score');
      const distEl = document.getElementById('distance');
      const sticksEl = document.getElementById('sticksCount');

      let state = 'menu'; // 'menu', 'playing'
      let keys = {};
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (state === 'menu' && e.key === 'Enter') startGame();
      });
      window.addEventListener('keyup', (e) => { keys[e.key] = false; });

      // Game objects
      let groundY = h * 0.78;
      let dog = { x: w * 0.15, y: groundY, r: 22, speed: 160 };
      let sticks = [];
      let score = 0;
      let distance = 0;
      let lastTime = 0;
      let spawnAccumulator = 0;

      function resetGame(){
        sticks = [];
        score = 0;
        distance = 0;
        spawnAccumulator = 0;
        dog.x = w * 0.15;
        dog.y = groundY;
        scoreEl.textContent = '0';
        distEl.textContent = '0';
        sticksEl.textContent = '0';
      }

      function startGame(){
        resize();
        groundY = h * 0.78;
        state = 'playing';
        overlay.style.display = 'none';
        resetGame();
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      function drawGround(){
        const groundTop = groundY;
        // sky and ground layers
        const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
        skyGrad.addColorStop(0, '#87CEEB');
        skyGrad.addColorStop(1, '#80c6ff');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        // ground
        ctx.fillStyle = '#6BAF3D';
        ctx.fillRect(0, groundTop, w, h - groundTop);

        // a simple path line
        ctx.strokeStyle = '#5a8d2e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, groundTop);
        ctx.lineTo(w, groundTop);
        ctx.stroke();
      }

      function drawDog(d){
        ctx.save();
        ctx.translate(d.x, d.y);
        // body
        ctx.fillStyle = '#8B5A2B';
        ctx.beginPath();
        ctx.ellipse(0, 0, 28, 20, 0, 0, Math.PI*2);
        ctx.fill();

        // head
        ctx.fillStyle = '#A0522D';
        ctx.beginPath();
        ctx.arc(30, -4, 12, 0, Math.PI*2);
        ctx.fill();

        // ear
        ctx.fillStyle = '#3B2C1C';
        ctx.beginPath();
        ctx.moveTo(40,-16);
        ctx.lineTo(30,-30);
        ctx.lineTo(50,-22);
        ctx.closePath();
        ctx.fill();

        // eye
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(32, -2, 2, 0, Math.PI*2);
        ctx.fill();

        // legs
        ctx.strokeStyle = '#654321';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-12, 18); ctx.lineTo(-12, 30);
        ctx.moveTo(6, 18); ctx.lineTo(6, 30);
        ctx.stroke();

        ctx.restore();
      }

      function drawStick(s){
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.strokeStyle = '#8B5A2B';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.stroke();
        // leaf tip
        ctx.fillStyle = '#DEB887';
        ctx.fillRect(-3, -6, 6, 12);
        ctx.restore();
      }

      function loop(now){
        if (state !== 'playing') return;
        const dt = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;

        // Move dog with controls
        if (keys['ArrowLeft'] || keys['a']) dog.x -= dog.speed * dt;
        if (keys['ArrowRight'] || keys['d']) dog.x += dog.speed * dt;
        if (keys['ArrowUp'] || keys['w']) dog.y -= dog.speed * dt;
        if (keys['ArrowDown'] || keys['s']) dog.y += dog.speed * dt;

        // boundary clamp
        dog.x = Math.max(22, Math.min(w - 22, dog.x));
        dog.y = Math.max(groundY - 60, Math.min(groundY, dog.y));

        // spawn sticks
        spawnAccumulator += dt;
        if (spawnAccumulator > 0.6) {
          spawnAccumulator = 0;
          const s = {
            x: w + Math.random()*120,
            y: groundY - (40 + Math.random()*60),
            r: 6 + Math.random()*6,
            vx: -120 - Math.random()*60
          };
          sticks.push(s);
        }

        // move sticks
        for (let i = sticks.length-1; i>=0; i--){
          const st = sticks[i];
          st.x += st.vx * dt;
          if (st.x < -20) sticks.splice(i,1);
        }

        // collect
        for (let i = sticks.length-1; i>=0; i--){
          const st = sticks[i];
          const dx = dog.x - st.x;
          const dy = dog.y - st.y;
          const d = Math.hypot(dx, dy);
          if (d < dog.r + st.r){
            sticks.splice(i,1);
            score += 1;
            distance += 5;
          }
        }

        // distance grows as you walk
        distance += dt * 80;
        scoreEl.textContent = score.toString();
        distEl.textContent = Math.floor(distance).toString();
        sticksEl.textContent = sticks.length.toString();

        // render
        ctx.clearRect(0,0,w,h);

        // background
        drawGround();

        // sticks
        for (let s of sticks){ drawStick(s); }

        // dog
        drawDog(dog);

        requestAnimationFrame(loop);
      }

      // start with menu on load
      overlay.style.display = 'flex';
    })();
  </script>
</body>
</html>
